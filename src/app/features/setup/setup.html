<header class="top">
  <app-marca />
</header>

<main>
  <form [formGroup]="form" (ngSubmit)="start()">
    <label class="label" for="equipo1">Pareja 1</label>
    <input id="equipo1" formControlName="equipo1" placeholder="Jugador1 Jugador2" autocomplete="off" />

    <label class="label" for="equipo2">Pareja 2</label>
    <input id="equipo2" formControlName="equipo2" placeholder="Jugador1 Jugador2" autocomplete="off" />

    <small class="ayuda">*Introduce solo los nombres y separa los nombres con un espacio para saber quién saca.</small>

    <label class="label">Sets</label>
    <div class="segmented">
      <label>
        <input type="radio" name="setsPaGanar" formControlName="setsPaGanar" [value]="2">
        <span>Al mejor de 3</span>
      </label>
      <label>
        <input type="radio" name="setsPaGanar" formControlName="setsPaGanar" [value]="1">
        <span>A 1 set</span>
      </label>
    </div>

    <label class="label">Tie-break en 6-6</label>
    <div class="segmented">
      <label>
        <input type="radio" name="tieBreak" formControlName="tieBreak" [value]="true">
        <span>Sí</span>
      </label>
      <label>
        <input type="radio" name="tieBreak" formControlName="tieBreak" [value]="false">
        <span>No</span>
      </label>
    </div>

    <label class="label" for="saque">Empieza sacando</label>
    <select id="saque" formControlName="comienzaSacando">
      @for (op of serverOptions(); track op.value) {
      <option [value]="op.value">{{ op.label }}</option>
      }
    </select>

    <button type="submit" [disabled]="form.invalid">
      EMPEZAR PARTIDO
      <span class="arrow">→</span>
    </button>

  </form>
</main>
